name: Money-free sandbox tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run strategy simulation
        run: python simulator.py --attempts 100 --seed 42
      - name: Run adaptive agent
        run: python agent.py --rounds 120 --seed 42
      - name: Run multi-agent world
        run: python multi_agent.py --rounds 120 --seed 42
      - name: Run strategy benchmark
        run: python benchmark.py --seeds 10 --rounds 120
